{% extends "base.html" %}

{% block body_class %}add-expense-page{% endblock %}  <!-- ✅ Fix: Ensure this is inside body_class -->

{% block content %}
<div class="add-expense-container">
    <h2>Add Expense</h2>
    <form method="POST" action="{{ url_for('main.add_expense_manual') }}" class="add-expense-form">
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <ul>
                    {% for message in messages %}
                        <li>{{ message }}</li>
                    {% endfor %}
                </ul>
            {% endif %}
        {% endwith %}

        <div class="form-group">
            <label for="expense_name">Expense Name</label>
            <input type="text" id="expense_name" name="expense_name" required>
        </div>

        <div class="form-group">
            <label for="expense_amount">Amount</label>
            <input type="text" id="expense_amount" name="expense_amount" required>
        </div>

        <div class="form-group">
            <label for="expense_category">Category</label>
            <select id="expense_category" name="expense_category" required>
                <option value="food">Food</option>
                <option value="transportation">Transportation</option>
                <option value="utilities">Utilities</option>
                <option value="entertainment">Entertainment</option>
                <option value="other">Other</option>
            </select>
        </div>

        <div class="form-group">
            <label for="expense_date">Date</label>
            <input type="date" id="expense_date" name="expense_date" required>
        </div>

        <button type="submit">Add Expense</button>
    </form>
</div>
{% endblock %}
